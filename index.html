<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Comovamos | Gestor de proyectos</title>
  
  <!-- Favicon icono grid_view (True Pink) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FD1843'><path d='M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z'/></svg>">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">

  <!-- SDK oficial de autenticación de Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- PANTALLA 1: LOGIN -->
  <div id="login-screen" class="screen-container active">
    <div class="login-card">
      <div class="brand-header">
        <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z"/>
        </svg>
        <h1>Comovamos</h1>
      </div>
      <p class="login-subtitle">[Banco Plaza]</p>

      <div id="login-actions">
        <button id="google-login-btn" class="btn-google">
          <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo" class="google-logo">
          <span>Iniciar sesión con Google</span>
        </button>
        <div id="login-error" class="error-message hidden"></div>
      </div>
    </div>
  </div>

  <!-- PANTALLA 2: CONTENEDOR PRINCIPAL -->
  <div id="app-screen" class="screen-container hidden">
    
    <!-- OVERLAY CAPA OSCURA PARA MÓVIL -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- BARRA LATERAL -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z"/>
          </svg>
          <span class="brand-name">Comovamos</span>
        </div>
        <button id="pin-sidebar-btn" class="icon-btn" title="Fijar menú">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 9V4l1 0V2H7v2l1 0v5L6 11v2h5v7l1 1 1-1v-7h5v-2l-2-2z"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-menu">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
          </svg>
          <span class="link-text">Dashboard</span>
        </a>
        <a href="#projects" class="nav-item" data-view="projects">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
          </svg>
          <span class="link-text">Proyectos</span>
        </a>
        <a href="#agenda" class="nav-item" data-view="agenda">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h10v2H7zm0 4h7v2H7z"/>
          </svg>
          <span class="link-text">Seguimiento</span>
        </a>
        <a href="#calendar" class="nav-item" data-view="calendar">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
          </svg>
          <span class="link-text">Calendario</span>
        </a>
        <a href="#reports" class="nav-item" data-view="reports">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-5h2v5zm4 0h-2v-8h2v8zm4 0h-2v-3h2v3z"/>
          </svg>
          <span class="link-text">Reportes</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#settings" class="nav-item" data-view="settings">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6 3.6z"/>
          </svg>
          <span class="link-text">Configuración</span>
        </a>
        <button id="logout-btn" class="nav-item btn-logout">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
          <span class="link-text">Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <!-- ÁREA DE CONTENIDO PRINCIPAL -->
    <div id="main-wrapper" class="main-wrapper">
      
      <!-- NAVBAR SUPERIOR -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button id="toggle-sidebar-btn" class="icon-btn">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
          </button>
          <h2 id="page-title" class="page-title">Dashboard</h2>
        </div>

        <div class="navbar-right">
          <button id="theme-toggle-btn" class="icon-btn" title="Cambiar tema">
            <svg id="theme-icon" class="icon-svg" viewBox="0 0 24 24" fill="currentColor"></svg>
          </button>
          
          <div class="user-profile">
            <img id="user-avatar" src="" alt="Avatar" class="avatar-img hidden">
            <div class="user-info">
              <span id="user-name" class="user-name">Cargando...</span>
              <span id="user-role" class="user-role">Colaborador</span>
            </div>
          </div>
        </div>
      </header>

      <!-- VISTAS DINÁMICAS -->
      <main id="content-area" class="content-area">
        
        <!-- Vista Dashboard -->
        <section id="view-dashboard" class="view-pane">
          <div class="kpi-grid">
            <div class="kpi-card">
              <svg class="kpi-icon-svg primary" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
              </svg>
              <div>
                <span class="kpi-value" id="kpi-active-projects">0</span>
                <span class="kpi-label">Proyectos activos</span>
              </div>
            </div>
            <div class="kpi-card">
              <svg class="kpi-icon-svg warning" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
              </svg>
              <div>
                <span class="kpi-value" id="kpi-pending-tasks">0</span>
                <span class="kpi-label">Tareas en curso</span>
              </div>
            </div>
            <div class="kpi-card">
              <svg class="kpi-icon-svg danger blink" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
              </svg>
              <div>
                <span class="kpi-value" id="kpi-overdue-tasks">0</span>
                <span class="kpi-label">Tareas vencidas</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Vista Seguimiento (Agenda Diaria) -->
        <section id="view-agenda" class="view-pane hidden">
          <div class="agenda-header">
            <h3>Seguimiento de hoy</h3>
            <span id="current-date-label" class="date-label"></span>
          </div>

          <!-- Formulario rápido para añadir tareas -->
          <form id="add-task-form" class="quick-add-task">
            <input type="text" id="task-input-title" placeholder="Escribe una nueva tarea de seguimiento..." required />
            <select id="task-input-priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
            <button type="submit" class="btn-add-task">+ Agregar</button>
          </form>

          <!-- Filtros Rápidos -->
          <div class="task-filters">
            <button class="filter-btn active" data-filter="todas">Todas</button>
            <button class="filter-btn" data-filter="pendientes">Pendientes</button>
            <button class="filter-btn" data-filter="completadas">Completadas</button>
          </div>

          <!-- Contenedor dinámico de tareas -->
          <div id="daily-tasks-list" class="tasks-container"></div>
        </section>

        <!-- Contenedores restantes -->
        <section id="view-projects" class="view-pane hidden"></section>
        <section id="view-calendar" class="view-pane hidden"></section>
        <section id="view-reports" class="view-pane hidden"></section>
        <section id="view-settings" class="view-pane hidden"></section>
      </main>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
